<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SURE SHOT V15 PRO - SYNCED</title>
    <style>
        :root { --neon: #00ff41; --danger: #ff003c; --gold: #ffea00; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; user-select: none; overflow-x: hidden; }
        .header-container { text-align: center; padding: 20px 10px; }
        .zigzag-name { font-size: 32px; font-weight: 900; letter-spacing: 5px; color: #fff; text-transform: uppercase; text-shadow: 2px 2px var(--danger), -2px -2px var(--neon), 0 0 20px var(--neon); animation: glitch 1.5s infinite; }
        
        .time-bar { background: rgba(0, 255, 65, 0.1); padding: 5px; font-family: 'Courier New', monospace; font-size: 14px; color: var(--neon); border-bottom: 1px solid var(--neon); margin-bottom: 15px; }
        .timer-box { margin: 15px 0; position: relative; }
        .timer-circle { width: 80px; height: 80px; border-radius: 50%; border: 4px solid #333; display: flex; align-items: center; justify-content: center; margin: 0 auto; font-size: 24px; font-weight: bold; position: relative; animation: rgb-glow 2s linear infinite; }
        
        .period-display { color: var(--neon); font-family: 'Courier New', monospace; font-size: 18px; margin: 10px 0; letter-spacing: 1px; border: 1px solid rgba(0, 255, 65, 0.3); padding: 10px; border-radius: 10px; background: rgba(0,0,0,0.5); }

        @keyframes rgb-glow {
            0% { border-color: #ff0000; box-shadow: 0 0 10px #ff0000; }
            33% { border-color: #00ff00; box-shadow: 0 0 10px #00ff00; }
            66% { border-color: #0000ff; box-shadow: 0 0 10px #0000ff; }
            100% { border-color: #ff0000; box-shadow: 0 0 10px #ff0000; }
        }

        @keyframes glitch { 0% { transform: skew(0deg); } 20% { transform: skew(-3deg); text-shadow: 2px 2px var(--neon), -2px -2px var(--danger); } 40% { transform: skew(3deg); } 100% { transform: skew(0deg); } }
        .glass-box { max-width: 400px; margin: 0 auto 20px; background: rgba(255,255,255,0.03); border: 1px solid rgba(0,255,65,0.2); border-radius: 25px; padding: 25px; backdrop-filter: blur(15px); text-align: center; }
        input { width: 100%; padding: 15px; background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 12px; color: var(--neon); font-size: 16px; margin: 15px 0; outline: none; text-align: center; }
        .btn-main { width: 100%; padding: 15px; background: linear-gradient(45deg, var(--neon), #008f11); border: none; border-radius: 12px; color: #000; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; }
        .pred-val { font-size: 50px; font-weight: 900; margin: 5px 0; text-shadow: 0 0 20px var(--neon); }
        
        .extra-numbers-box { margin-top: 15px; padding: 10px; border: 1px solid var(--gold); border-radius: 10px; background: rgba(255, 234, 0, 0.05); }
        .extra-label { font-size: 11px; color: var(--gold); text-transform: uppercase; margin-bottom: 5px; display: block;}

        table { width: 100%; margin-top: 20px; border-collapse: collapse; font-size: 11px; }
        th { color: #888; border-bottom: 1px solid #222; padding: 8px; }
        td { padding: 10px; border-bottom: 1px solid #111; text-align: center; }
        .win { color: var(--neon); font-weight: bold; }
        .loss { color: var(--danger); font-weight: bold; }
        .hidden { display: none; }

        .btn-market { width: 100%; padding: 12px; background: linear-gradient(45deg, #ff003c, #800020); border: 2px solid #fff; border-radius: 12px; color: #fff; font-weight: 800; margin-bottom: 10px; cursor: pointer; }
        .btn-history { width: 100%; padding: 12px; background: linear-gradient(45deg, #2575fc, #6a11cb); border: 1px solid #fff; border-radius: 12px; color: #fff; font-weight: 800; margin-bottom: 15px; cursor: pointer; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: #000; overflow-y: auto; }
        .modal-content { width: 100%; height: calc(100% - 50px); border: none; }
        .close-btn { background: #ff003c; color: #fff; padding: 15px; text-align: center; font-weight: bold; cursor: pointer; position: sticky; top: 0; z-index: 1001; }

        #floatingIcon { position: fixed; top: 70px; left: 15px; width: 55px; height: 55px; background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); border-radius: 50%; display: none; z-index: 10001; justify-content: center; align-items: center; box-shadow: 0 0 20px rgba(0,255,65,0.4); cursor: pointer; border: 2px solid #fff; font-size: 24px; }

        #miniResultBar { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 420px; background: linear-gradient(90deg, #6a11cb, #2575fc); border-radius: 35px; padding: 12px 20px; display: none; z-index: 10002; box-shadow: 0 5px 25px rgba(0,0,0,0.6); justify-content: space-between; align-items: center; color: white; font-weight: bold; border: 1px solid rgba(255,255,255,0.3); }
        .mini-badge { background: rgba(255,255,255,0.25); padding: 6px 18px; border-radius: 15px; color: #ffea00; font-size: 18px; text-transform: uppercase; box-shadow: inset 0 0 10px rgba(0,0,0,0.2); }
        
        .history-table { width: 95%; margin: 20px auto; background: #111; border: 1px solid #333; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="time-bar" id="utcTime">UTC: 00:00:00</div>

    <div class="header-container">
        <div class="zigzag-name">SURE SHOT BOT</div>
        <div style="color: var(--gold); font-size: 10px; letter-spacing: 4px; margin-top: 5px;"> Smart Ai PRO 99.1% Accuracy </div>
    </div>

    <div id="floatingIcon" onclick="toggleMiniBar()">🔎</div>
    <div id="miniResultBar">
        <span id="mID" style="font-family: monospace;">#-----</span>
        <div class="mini-badge" id="mRes">WAIT</div>
        <span id="mOpps" style="color: #ffea00; letter-spacing: 1px;">-,-</span>
        <span style="font-size: 10px; color: #00ff41;">LIVE ●</span>
    </div>

    <div id="loginPage" class="glass-box">
        <h3 style="margin:0; color:var(--neon); font-size: 14px;">ENTER PASSWORD</h3>
        <input type="password" id="passIn" placeholder="Enter Password Here">
        <button class="btn-main" onclick="checkPassword()">LOGIN</button>
        <p id="err" style="color:var(--danger); font-size: 12px; margin-top: 10px;"></p>
    </div>

    <div id="appPage" class="glass-box hidden">
        <button class="btn-market" onclick="openMarket()"> 🔑 OPEN MARKET</button>
        <button class="btn-history" onclick="openHistory()"> 📜 MY HISTORY</button>

        <div class="timer-box">
            <div class="timer-circle" id="countdown">30</div>
        </div>

        <div style="font-size: 10px; color: #888; margin-top: 10px;">ACTIVE PERIOD</div>
        <div class="period-display" id="autoPeriod">LOADING...</div>
        
        <div class="pred-val" id="pRes">WAIT...</div>
        
        <div style="color: var(--gold); font-size: 13px; font-weight: bold; border:1px dashed var(--gold); padding:8px;" id="pOpps">SYNCING...</div>
        
        <div class="extra-numbers-box">
            <span class="extra-label">2nd Code Prediction Numbers</span>
            <div id="numberDisplay2" style="font-size: 20px; color: var(--neon); font-weight: bold; letter-spacing: 3px;">- , -</div>
        </div>
        
        <table>
            <thead><tr><th>PRD</th><th>PRED</th><th>NUM</th><th>STATUS</th></tr></thead>
            <tbody id="logs"></tbody>
        </table>
        <button onclick="logout()" style="background:transparent; color:#444; border:none; margin-top:15px; font-size:10px; cursor:pointer;">LOGOUT / CLEAR</button>
    </div>

    <div id="marketModal" class="modal">
        <div class="close-btn" onclick="closeMarket()">📌 HIDE MARKET</div>
        <iframe src="https://www.dkwin19.com/#/register?invitationCode=442271095072" class="modal-content"></iframe>
    </div>

    <div id="historyModal" class="modal">
        <div class="close-btn" onclick="closeHistory()">⬅ BACK TO APP</div>
        <h2 style="text-align:center; color:var(--gold); font-size:18px; margin-top:20px;">FULL SESSION HISTORY</h2>
        <table class="history-table">
            <thead>
                <tr><th>PERIOD</th><th>PREDICTION</th><th>NUMBERS (1&2)</th><th>RESULT</th><th>STATUS</th></tr>
            </thead>
            <tbody id="fullHistoryLogs"></tbody>
        </table>
    </div>

<script>
    // --- TELEGRAM CONFIGURATION ---
    const TG_CONFIG = {
        token: "8313454399:AAFVRkz9fTZiMKuTxA1PEZsHU8L7uheQC8s", // এখানে আপনার বট টোকেন দিন
        chatId: "@Rk1Trader", // এখানে আপনার চ্যানেল ইউজারনেম বা আইডি দিন
        startSticker: "CAACAgUAAxkBAAEQQPppakFbk3fqeWzooRLIx3RKgAHIrwACUhYAAlEJ-VVZvLkjcrQPSTgE", // Season Start Sticker ID
        endSticker: "CAACAgUAAxkBAAEQQPxpakFtr-vvDe05t6M7KXqUvc6xEQACIhYAAi3U8FUVaqmrOChRqDgE",   // Season End Sticker ID
        winSticker: "CAACAgUAAxkBAAEQPxhpaN8xti9Ug8pzCuTOIKSMudQ2OAAC4xkAAi_xcVX60TxI2of6nDgE"    // Win Sticker ID
    };

    let isBotRunning = false;
    let lastProcessedUpdateId = 0;

    const ACCESS_PASS = "99x";
    const BIG_POOL = [5,6,7,8,9], SMALL_POOL = [0,1,2,3,4];
    let currentOpposites = ["?", "?"];
    let currentNumbers2 = ["?", "?"];
    let sessionHistory = []; 

    // --- TELEGRAM API CALLS ---
    async function sendTgMessage(text) {
        try {
            await fetch(`https://api.telegram.org/bot${TG_CONFIG.token}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TG_CONFIG.chatId, text: text, parse_mode: "HTML" })
            });
        } catch (e) { console.error("TG Send Error", e); }
    }

    async function sendTgSticker(stickerId) {
        try {
            await fetch(`https://api.telegram.org/bot${TG_CONFIG.token}/sendSticker`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TG_CONFIG.chatId, sticker: stickerId })
            });
        } catch (e) {}
    }

    function generateSummary() {
        if (sessionHistory.length === 0) return "No data available.";
        let summary = "🏆 SESSION SUMMARY REPORT 🏆\n\n----------------------------------------\n\n";
        let wins = 0;
        [...sessionHistory].reverse().forEach((item, index) => {
            const status = item.win ? "WIN ✅✅✅✅" : "Loss 🚫🚫🚫🚫";
            if (item.win) wins++;
            summary += `${index + 1}. PD: ${item.id} | ${status}\n`;
        });
        summary += `\n-----------------------------------------\n✅ Total Wins: ${wins}\n🎯 Powered by VIP System`;
        return summary;
    }

    async function checkTgCommands() {
        try {
            const res = await fetch(`https://api.telegram.org/bot${TG_CONFIG.token}/getUpdates?offset=${lastProcessedUpdateId + 1}`);
            const data = await res.json();
            if (data.result) {
                data.result.forEach(update => {
                    lastProcessedUpdateId = update.update_id;
                    const msg = update.message?.text;
                    if (msg === "/prediction") {
                        isBotRunning = true;
                        sendTgSticker(TG_CONFIG.startSticker);
                        sendTgMessage("🚀 <b>PREDICTION STARTED!</b>");
                    } else if (msg === "/stop") {
                        if(isBotRunning) {
                            sendTgSticker(TG_CONFIG.endSticker);
                            sendTgMessage(generateSummary());
                        }
                        isBotRunning = false;
                    } else if (msg === "/summary") {
                        sendTgMessage(generateSummary());
                    }
                });
            }
        } catch (e) {}
    }
    setInterval(checkTgCommands, 3000);

    // --- ORIGINAL LOGIC ---
    function seededRandom(seed) {
        const x = Math.sin(seed) * 10000;
        return x - Math.floor(x);
    }

    function generate17DigitPeriod(apiIssue) {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        return `${year}${month}${day}1000${apiIssue.slice(-5)}`;
    }

    function openMarket() { 
        document.getElementById('marketModal').style.display = 'block'; 
        document.getElementById('floatingIcon').style.display = 'flex'; 
    }
    function closeMarket() { 
        document.getElementById('marketModal').style.display = 'none'; 
        document.getElementById('floatingIcon').style.display = 'none';
        document.getElementById('miniResultBar').style.display = 'none';
    }

    function openHistory() {
        document.getElementById('historyModal').style.display = 'block';
        renderFullHistory();
    }
    function closeHistory() {
        document.getElementById('historyModal').style.display = 'none';
    }

    function toggleMiniBar() {
        const bar = document.getElementById('miniResultBar');
        bar.style.display = (bar.style.display === 'flex') ? 'none' : 'flex';
    }

    function updateUTCTime() {
        const now = new Date();
        const h = String(now.getUTCHours()).padStart(2, '0');
        const m = String(now.getUTCMinutes()).padStart(2, '0');
        const s = String(now.getUTCSeconds()).padStart(2, '0');
        document.getElementById('utcTime').innerText = `UTC TIME: ${h}:${m}:${s}`;
    }
    setInterval(updateUTCTime, 1000);

    function startCountdown() {
        setInterval(() => {
            const now = new Date();
            const seconds = now.getUTCSeconds();
            const remaining = 30 - (seconds % 30);
            document.getElementById('countdown').innerText = (remaining < 10 ? "0" : "") + remaining;
        }, 1000);
    }

    function checkPassword() {
        const input = document.getElementById('passIn').value;
        if(input === ACCESS_PASS) {
            sessionStorage.setItem('isLogged', 'true');
            showApp();
        } else {
            document.getElementById('err').innerText = "WRONG PASSWORD!";
        }
    }

    function showApp() {
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('appPage').classList.remove('hidden');
        startCountdown();
        runLogic();
    }

    function renderFullHistory() {
        const container = document.getElementById('fullHistoryLogs');
        container.innerHTML = sessionHistory.map(item => `
            <tr>
                <td>${item.id}</td>
                <td>${item.pred}</td>
                <td style="color:var(--gold)">${item.n1} | ${item.n2}</td>
                <td>${item.num}</td>
                <td class="${item.win ? 'win' : 'loss'}">${item.win ? 'WIN 🎯' : 'LOSS ❌'}</td>
            </tr>
        `).join('');
    }

    async function runLogic() {
        setInterval(async () => {
            try {
                const res = await fetch('https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?ts=' + Date.now());
                const json = await res.json();
                const latest = json.data.list[0];
                
                const trend = json.data.list.slice(0, 3).map(x => parseInt(x.number) >= 5 ? "BIG" : "SMALL");
                const nextPred = trend.filter(x => x === "BIG").length > 1 ? "BIG" : "SMALL";

                const nextIssueRaw = (BigInt(latest.issueNumber) + 1n).toString();
                const full17DigitID = generate17DigitPeriod(nextIssueRaw);
                const seedBase = parseInt(nextIssueRaw.slice(-8));

                if(window.lastId !== latest.issueNumber) {
                    const actualSize = parseInt(latest.number) >= 5 ? "BIG" : "SMALL";
                    let checkAgainst = window.savedPrediction || nextPred;
                    
                    let historyN1 = currentOpposites.join(",");
                    let historyN2 = currentNumbers2.join(",");

                    const sameSide = nextPred === "BIG" ? BIG_POOL : SMALL_POOL;
                    const oppSide = nextPred === "BIG" ? SMALL_POOL : BIG_POOL;
                    
                    currentOpposites = [
                        sameSide[Math.floor(seededRandom(seedBase) * 5)],
                        oppSide[Math.floor(seededRandom(seedBase + 1) * 5)]
                    ];

                    currentNumbers2 = [
                        sameSide[Math.floor(seededRandom(seedBase + 2) * 5)],
                        oppSide[Math.floor(seededRandom(seedBase + 3) * 5)]
                    ];

                    if(window.lastId) {
                        const isWin = (checkAgainst === actualSize);
                        const statusText = isWin ? 'WIN 🎯' : 'LOSS ❌';
                        
                        sessionHistory.unshift({
                            id: latest.issueNumber.slice(-3),
                            pred: checkAgainst,
                            n1: historyN1,
                            n2: historyN2,
                            num: latest.number,
                            win: isWin
                        });

                        const row = `<tr><td>${latest.issueNumber.slice(-3)}</td><td>${checkAgainst}</td><td>${latest.number}</td><td class="${isWin?'win':'loss'}">${statusText}</td></tr>`;
                        document.getElementById('logs').innerHTML = row;

                        // TG Result Announcement
                        if(isBotRunning) {
                            if(isWin) sendTgSticker(TG_CONFIG.winSticker);
                        }
                    }

                    window.lastId = latest.issueNumber;
                    window.savedPrediction = nextPred;

                    // Send TG Prediction Message
                    if(isBotRunning) {
                        const tgMsg = `🎖️ WINGO 30 SEC 🎖️\n\n🔰 🅿🅳: ${full17DigitID}\n\n🎯 𝐏𝐑𝐄𝐃: ${nextPred} 🎯`;
                        sendTgMessage(tgMsg);
                    }
                }
                
                document.getElementById('autoPeriod').innerText = full17DigitID;
                document.getElementById('pRes').innerText = nextPred;
                document.getElementById('pOpps').innerText = "1st CODE NUMS: " + currentOpposites.join(", ");
                document.getElementById('numberDisplay2').innerText = currentNumbers2.join(", ");

                document.getElementById('mID').innerText = "#" + full17DigitID.slice(-5);
                document.getElementById('mRes').innerText = nextPred;
                document.getElementById('mOpps').innerText = currentOpposites.join(",");

            } catch(e) {}
        }, 2000);
    }

    function logout() { 
        sessionStorage.clear();
        location.reload(); 
    }
    
    window.onload = () => {
        if(sessionStorage.getItem('isLogged') === 'true') {
            showApp();
        }
    };
</script>
</body>
  </html>
